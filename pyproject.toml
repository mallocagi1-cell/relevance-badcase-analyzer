[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rba"
version = "0.1.0"
description = "相关性模型坏例的权重空间分析与最小修复"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rba" }]
dependencies = [
  "torch>=2.2",
  "numpy>=1.24",
  "PyYAML>=6",
  "matplotlib>=3.7",
  "tqdm>=4.66",
  # Qwen3.5 classes (Qwen3_5ForConditionalGeneration, Qwen3VLProcessor) exist from transformers 5.x;
  # the suite is run against 5.22.1. The CPU path needs nothing else.
  "transformers>=5.22",
  "safetensors>=0.4",
  # Real images go to the model's own processor as PIL images.
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# rba finetune --mode lora (default). Not needed for analyze / eval / export.
finetune = ["peft>=0.13"]
# Optional CUDA kernels for GatedDeltaNet layers (flash-linear-attention, causal-conv1d). Without
# them transformers falls back to a correct but slower PyTorch implementation. These need a matching
# CUDA toolchain, so they are not installed by default:
#   pip install flash-linear-attention causal-conv1d

[project.scripts]
rba = "rba.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
