[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rba"
version = "0.1.0"
description = "相关性模型坏例的权重空间分析与最小修复"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rba" }]
dependencies = [
  "torch>=2.2",
  "numpy>=1.24",
  "PyYAML>=6",
  "matplotlib>=3.7",
  "tqdm>=4.66",
  "transformers>=4.51",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rba = "rba.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
